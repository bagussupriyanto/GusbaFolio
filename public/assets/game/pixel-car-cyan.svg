<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <!-- Cyan Retro Pixel Sports Car -->
  <rect x="20" y="18" width="80" height="12" fill="#0EA5E9" rx="2" />
  <rect x="38" y="8" width="42" height="10" fill="#38BDF8" rx="2" />
  <!-- Windshield Windows -->
  <rect x="44" y="10" width="14" height="6" fill="#7DD3FC" />
  <rect x="62" y="10" width="14" height="6" fill="#7DD3FC" />
