  <rect x="96" y="20" width="6" height="5" fill="#4EE6D8" />
  <circle cx="106" cy="22" r="8" fill="#99F6E4" opacity="0.6" />
  <!-- Tail Lights -->
  <rect x="18" y="20" width="4" height="5" fill="#F43F5E" />
  <!-- Wheels -->
  <circle cx="34" cy="30" r="6.5" fill="#090D16" stroke="#0284C7" stroke-width="2" />
  <circle cx="34" cy="30" r="2.5" fill="#E2E8F0" />
  <circle cx="86" cy="30" r="6.5" fill="#090D16" stroke="#0284C7" stroke-width="2" />
  <circle cx="86" cy="30" r="2.5" fill="#E2E8F0" />
</svg>
