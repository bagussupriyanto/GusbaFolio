<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <!-- Red Retro Pixel Cyber Taxi Car -->
  <rect x="20" y="16" width="80" height="14" fill="#E11D48" rx="2" />
  <rect x="36" y="6" width="48" height="12" fill="#F43F5E" rx="2" />
  <!-- Windshield Windows -->
  <rect x="42" y="8" width="18" height="8" fill="#38BDF8" />
  <rect x="64" y="8" width="16" height="8" fill="#38BDF8" />
  <!-- Headlights Glow -->
  <rect x="96" y="18" width="6" height="6" fill="#FDE047" />
  <circle cx="106" cy="21" r="8" fill="#FEF08A" opacity="0.6" />
  <!-- Tail Lights -->
  <rect x="18" y="18" width="4" height="6" fill="#EF4444" />
  <!-- Wheels -->
  <circle cx="36" cy="30" r="7" fill="#090D16" stroke="#475569" stroke-width="2" />
  <circle cx="36" cy="30" r="3" fill="#94A3B8" />
  <circle cx="84" cy="30" r="7" fill="#090D16" stroke="#475569" stroke-width="2" />
  <circle cx="84" cy="30" r="3" fill="#94A3B8" />
</svg>
