<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360">
  <!-- Night Sky Background -->
  <rect width="400" height="360" fill="#0a0e17"/>
  
  <!-- Stars -->
  <circle cx="30" cy="20" r="1.5" fill="#F8FAFC" opacity="0.8"/>
  <circle cx="80" cy="45" r="1" fill="#F8FAFC" opacity="0.6"/>
  <circle cx="150" cy="15" r="1.5" fill="#F8FAFC" opacity="0.7"/>
  <circle cx="220" cy="35" r="1" fill="#F8FAFC" opacity="0.5"/>
  <circle cx="300" cy="25" r="1.5" fill="#F8FAFC" opacity="0.8"/>
  <circle cx="350" cy="50" r="1" fill="#F8FAFC" opacity="0.6"/>
  <circle cx="370" cy="18" r="1.5" fill="#F8FAFC" opacity="0.7"/>
  <circle cx="120" cy="55" r="1" fill="#F8FAFC" opacity="0.5"/>
  <circle cx="260" cy="12" r="1" fill="#F8FAFC" opacity="0.9"/>
  
  <!-- Moon -->
  <circle cx="340" cy="55" r="22" fill="#D4A853" opacity="0.9"/>
  <circle cx="348" cy="48" r="18" fill="#0a0e17"/>
  
  <!-- Background Trees -->
  <polygon points="30,180 45,120 60,180" fill="#0F2A1A" opacity="0.7"/>
  <polygon points="340,190 358,125 376,190" fill="#0F2A1A" opacity="0.7"/>
  <polygon points="360,195 375,140 390,195" fill="#142E1E" opacity="0.6"/>
  
  <!-- Ground -->
  <rect x="0" y="280" width="400" height="80" fill="#1a2638"/>
  <rect x="0" y="278" width="400" height="4" fill="#263852"/>
  
  <!-- Grass patches -->
  <rect x="10" y="276" width="8" height="4" fill="#2D5A3D" rx="1"/>
  <rect x="50" y="275" width="10" height="5" fill="#2D5A3D" rx="1"/>
  <rect x="310" y="276" width="8" height="4" fill="#2D5A3D" rx="1"/>
  <rect x="360" y="275" width="12" height="5" fill="#2D5A3D" rx="1"/>
  
  <!-- WOODEN CABIN HOUSE -->
  <!-- Cabin Base Wall -->
  <rect x="100" y="170" width="200" height="110" fill="#5C3A1E"/>
  <rect x="100" y="170" width="200" height="110" fill="url(#woodGrain)" opacity="0.3"/>
  
  <!-- Wood Grain Pattern -->
  <defs>
    <pattern id="woodGrain" patternUnits="userSpaceOnUse" width="20" height="10">
      <rect width="20" height="10" fill="transparent"/>
      <line x1="0" y1="5" x2="20" y2="5" stroke="#4A2E15" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Cabin Roof -->
  <polygon points="80,175 200,90 320,175" fill="#8B4513"/>
  <polygon points="85,175 200,95 315,175" fill="#A0522D"/>
  <!-- Roof ridge line -->
  <line x1="200" y1="90" x2="200" y2="95" stroke="#6B3410" stroke-width="3"/>
  
  <!-- Chimney -->
  <rect x="250" y="100" width="25" height="50" fill="#4A3728"/>
  <rect x="247" y="95" width="31" height="8" fill="#5C4033"/>
  <!-- Smoke -->
  <circle cx="262" cy="82" r="5" fill="#94A3B8" opacity="0.3"/>
  <circle cx="258" cy="70" r="4" fill="#94A3B8" opacity="0.2"/>
  <circle cx="265" cy="58" r="3" fill="#94A3B8" opacity="0.15"/>
  
  <!-- Door -->
  <rect x="175" y="210" width="50" height="70" fill="#3E2510" rx="2"/>
  <rect x="178" y="213" width="44" height="64" fill="#4A2E15" rx="1"/>
  <!-- Door handle -->
  <circle cx="213" cy="248" r="3" fill="#D4A853"/>
  
  <!-- Left Window (warm glow) -->
  <rect x="118" y="200" width="40" height="35" fill="#1a1a2e" stroke="#5C3A1E" stroke-width="3"/>
  <rect x="121" y="203" width="34" height="29" fill="#FDE68A" opacity="0.7"/>
  <rect x="121" y="203" width="34" height="29" fill="#FBBF24" opacity="0.4"/>
  <!-- Window cross -->
  <line x1="138" y1="203" x2="138" y2="232" stroke="#5C3A1E" stroke-width="2"/>
  <line x1="121" y1="217" x2="155" y2="217" stroke="#5C3A1E" stroke-width="2"/>
  <!-- Window glow -->
  <rect x="115" y="197" width="46" height="41" fill="#FBBF24" opacity="0.08" rx="2"/>
  
  <!-- Right Window (warm glow) -->
  <rect x="242" y="200" width="40" height="35" fill="#1a1a2e" stroke="#5C3A1E" stroke-width="3"/>
  <rect x="245" y="203" width="34" height="29" fill="#FDE68A" opacity="0.7"/>
  <rect x="245" y="203" width="34" height="29" fill="#FBBF24" opacity="0.4"/>
  <!-- Window cross -->
  <line x1="262" y1="203" x2="262" y2="232" stroke="#5C3A1E" stroke-width="2"/>
  <line x1="245" y1="217" x2="279" y2="217" stroke="#5C3A1E" stroke-width="2"/>
  <!-- Window glow -->
  <rect x="239" y="197" width="46" height="41" fill="#FBBF24" opacity="0.08" rx="2"/>
  
  <!-- Left Lantern -->
  <rect x="68" y="240" width="4" height="40" fill="#5C4033"/>
  <rect x="62" y="232" width="16" height="12" fill="#D4A853" rx="2"/>
  <rect x="64" y="234" width="12" height="8" fill="#FBBF24" opacity="0.9" rx="1"/>
  <circle cx="70" cy="238" r="12" fill="#FBBF24" opacity="0.1"/>
  
  <!-- Right Lantern -->
  <rect x="328" y="240" width="4" height="40" fill="#5C4033"/>
  <rect x="322" y="232" width="16" height="12" fill="#D4A853" rx="2"/>
  <rect x="324" y="234" width="12" height="8" fill="#FBBF24" opacity="0.9" rx="1"/>
  <circle cx="330" cy="238" r="12" fill="#FBBF24" opacity="0.1"/>
  
  <!-- Pixel Character (standing in front of cabin) -->
  <!-- Head -->
  <rect x="188" y="286" width="14" height="14" fill="#E8B87A" rx="1"/>
  <!-- Hair -->
  <rect x="186" y="284" width="18" height="6" fill="#2C1810"/>
  <!-- Eyes -->
  <rect x="191" y="291" width="3" height="3" fill="#1a1a2e"/>
  <rect x="197" y="291" width="3" height="3" fill="#1a1a2e"/>
  <!-- Body (suit) -->
  <rect x="186" y="300" width="18" height="18" fill="#1E3A5F"/>
  <!-- Tie -->
  <rect x="194" y="300" width="3" height="10" fill="#E11D48"/>
  <!-- Legs -->
  <rect x="187" y="318" width="7" height="12" fill="#1a2638"/>
  <rect x="197" y="318" width="7" height="12" fill="#1a2638"/>
  <!-- Shoes -->
  <rect x="186" y="328" width="9" height="4" fill="#2C1810"/>
  <rect x="196" y="328" width="9" height="4" fill="#2C1810"/>
  
  <!-- Cobblestone Path -->
  <rect x="140" y="280" width="120" height="12" fill="#263852" opacity="0.6"/>
  <rect x="145" y="282" width="12" height="8" fill="#1a2638" rx="1" opacity="0.4"/>
  <rect x="162" y="282" width="14" height="8" fill="#1a2638" rx="1" opacity="0.4"/>
  <rect x="181" y="282" width="12" height="8" fill="#1a2638" rx="1" opacity="0.4"/>
  <rect x="198" y="282" width="14" height="8" fill="#1a2638" rx="1" opacity="0.4"/>
  <rect x="217" y="282" width="12" height="8" fill="#1a2638" rx="1" opacity="0.4"/>
  <rect x="234" y="282" width="14" height="8" fill="#1a2638" rx="1" opacity="0.4"/>
  
  <!-- "MY STUDIO" sign on cabin -->
  <rect x="160" y="180" width="80" height="18" fill="#0a0e17" rx="2" stroke="#4ee6d8" stroke-width="1.5"/>
  <text x="200" y="193" text-anchor="middle" font-family="monospace" font-size="10" fill="#4ee6d8" font-weight="bold">MY STUDIO</text>
</svg>
